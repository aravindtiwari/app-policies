<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Send feedback about Wicketkeep</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f2e9;color:#23211e;font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:420px;padding:28px 22px;text-align:center}
a.btn{display:inline-block;margin-top:10px;padding:.8em 1.4em;border-radius:999px;background:#2f5d7c;color:#fff;text-decoration:none;font-weight:600}
p{color:#57514a}
</style>
</head>
<body>
<main>
<h1>Opening the feedback form&hellip;</h1>
<p>Tell us about a bug, an idea or how Wicketkeep feels to use. We read every message.</p>
<p><a class="btn" id="go" href="https://practical-shelf.vercel.app/feedback/?app=wicketkeep&amp;platform=android">Open the feedback form</a></p>
</main>
<script>
// Forward to the shared form, keeping only the app version and platform the app added. Generated by make_feedback_pages.py (rule S29).
(function () {
  var p = new URLSearchParams(location.search), q = new URLSearchParams();
  q.set('app', "wicketkeep");
  q.set('platform', p.get('platform') === 'web' ? 'web' : 'android');
  var v = (p.get('v') || '').replace(/[^\w.\- ()+]/g, '').slice(0, 30);
  if (v) q.set('v', v);
  var to = "https://practical-shelf.vercel.app/feedback/" + '?' + q.toString();
  document.getElementById('go').href = to;
  location.replace(to);
})();
</script>
</body>
</html>
